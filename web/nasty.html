// ============================================================
// MIDI file parsing + drop into piano roll
// ============================================================
function parseVarLen(view, offset) {
  let value = 0, byte, n = 0;
  do {
    byte = view.getUint8(offset + n);
    value = (value << 7) | (byte & 0x7f);
    n++;
  } while (byte & 0x80);
  return { value, bytesRead: n };
}

function parseMidiFile(buffer) {
  const view = new DataView(buffer);
  if (view.getUint8(0) !== 0x4D || view.getUint8(1) !== 0x54 ||
      view.getUint8(2) !== 0x68 || view.getUint8(3) !== 0x64) {
    throw new Error('Not a MIDI file');
  }
  const headerLen = view.getUint32(4);
  const numTracks = view.getUint16(10);
  const division = view.getUint16(12);
  if (division & 0x8000) throw new Error('SMPTE-format MIDI files not supported');
  const ticksPerQuarter = division;
  let offset = 8 + headerLen;
  const allNotes = [];
  for (let ti = 0; ti < numTracks; ti++) {
    if (view.getUint8(offset) !== 0x4D || view.getUint8(offset+1) !== 0x54 ||
        view.getUint8(offset+2) !== 0x72 || view.getUint8(offset+3) !== 0x6B) {
      throw new Error('Missing track chunk');
    }
    const trackLen = view.getUint32(offset + 4);
    const trackEnd = offset + 8 + trackLen;
    offset += 8;
    let currentTick = 0, runningStatus = 0;
    const activeNotes = {};
    while (offset < trackEnd) {
      const dt = parseVarLen(view, offset);
      offset += dt.bytesRead;
      currentTick += dt.value;
      let status = view.getUint8(offset);
      if (status < 0x80) { status = runningStatus; }
      else { offset++; runningStatus = status; }
      const type = status & 0xf0;
      if (type === 0x80 || type === 0x90) {
        const pitch = view.getUint8(offset); offset++;
        const velocity = view.getUint8(offset); offset++;
        if (type === 0x90 && velocity > 0) {
          activeNotes[pitch] = { tick: currentTick, velocity: velocity / 127 };
        } else {
          const start = activeNotes[pitch];
          if (start) {
            allNotes.push({
              pitch, velocity: start.velocity,
              startBeat: start.tick / ticksPerQuarter,
              durationBeats: Math.max(0.0625, (currentTick - start.tick) / ticksPerQuarter),
            });
            delete activeNotes[pitch];
          }
        }
      } else if (type === 0xA0 || type === 0xB0 || type === 0xE0) {
        offset += 2;
      } else if (type === 0xC0 || type === 0xD0) {
        offset += 1;
      } else if (status === 0xFF) {
        offset++;
        const metaLen = parseVarLen(view, offset);
        offset += metaLen.bytesRead;
        offset += metaLen.value;
      } else if (status === 0xF0 || status === 0xF7) {
        const sysexLen = parseVarLen(view, offset);
        offset += sysexLen.bytesRead;
        offset += sysexLen.value;
      } else {
        console.warn('unknown midi status', status.toString(16));
        break;
      }
    }
    offset = trackEnd;
  }
  return allNotes;
}

function initPianoRollDrop() {
  const wrap = document.getElementById('pr-grid-wrap');
  wrap.addEventListener('dragover', (e) => {
    if (e.dataTransfer.types.includes('Files')) {
      e.preventDefault();
      wrap.style.boxShadow = 'inset 0 0 0 2px var(--accent-2)';
    }
  });
  wrap.addEventListener('dragleave', () => { wrap.style.boxShadow = ''; });
  wrap.addEventListener('drop', async (e) => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    wrap.style.boxShadow = '';
    const files = [...e.dataTransfer.files].filter(f =>
      f.name.toLowerCase().endsWith('.mid') || f.name.toLowerCase().endsWith('.midi'));
    if (!files.length) { alert('Drop a .mid or .midi file'); return; }
    const p = song.patterns.find(pt => pt.id === currentPatternId);
    if (!p) { alert('Open a pattern first'); return; }
    const activeCh = song.channels.find(c => c.id === pianoRollActiveChannelId);
    if (!activeCh) { alert('Pick a channel in the Draw on dropdown first'); return; }
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const notes = parseMidiFile(buf);
        for (const n of notes) {
          p.notes.push({
            channelId: activeCh.id, pitch: n.pitch,
            startBeat: n.startBeat, durationBeats: n.durationBeats,
            velocity: n.velocity,
          });
        }
        const maxEnd = p.notes.reduce((m,n)=>Math.max(m, n.startBeat+n.durationBeats), 0);
        if (maxEnd / 4 > p.lengthBars) p.lengthBars = Math.ceil(maxEnd / 4);
      } catch (err) {
        alert('Could not parse ' + file.name + ': ' + err.message);
      }
    }
    renderPianoRoll(); render();
  });
}

function addChatMessage(role, text, tools) {
  const container = document.getElementById('chat-messages');
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  msg.textContent = text || '';
  if (tools && tools.length) {
    const line = document.createElement('div');
    line.className = 'tool-line';
    line.textContent = tools.join(' · ');
    msg.appendChild(line);
  }
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
  return msg;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  addChatMessage('user', text);
  const thinking = addChatMessage('assistant', '');
  thinking.classList.add('thinking');
  thinking.textContent = 'thinking...';
  try {
    const resp = await fetch('/nasty/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ song, message: text, history: chatHistory }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    thinking.remove();
    const summaries = applyToolCalls(data.tool_calls || []);
    addChatMessage('assistant', data.text || '(done)', summaries);
    render();
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: data.text || 'done' });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    if (document.getElementById('autoplay').checked && song.tracks.some(t => t.clips.length)) playSong();
  } catch (e) {
    thinking.textContent = 'error: ' + e.message;
    thinking.classList.remove('thinking');
  } finally { sendBtn.disabled = false; }
}

// ============================================================
function saveToFile() {
  const stripped = JSON.parse(JSON.stringify(song));
  for (const t of stripped.tracks) t.clips = t.clips.filter(c => c.type !== 'audio');
  const blob = new Blob([JSON.stringify(stripped, null, 2)], { type: 'application/json' });
  downloadBlob(blob, 'nasty-song.json');
}
function loadFromFile() {
  const input = document.getElementById('file-input');
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.channels) { alert('This file uses the old format. Load an FL-model song.'); return; }
        song = ensureShape(parsed);
        currentPatternId = song.patterns[0]?.id || null;
        chatHistory = [];
        audioBuffers.clear();
        document.getElementById('chat-messages').innerHTML = '';
        render();
      } catch (e) { alert('Bad file: ' + e.message); }
    };
    reader.readAsText(f);
  };
  input.click();
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportWAV() {
  const dur = computeSongDurationSec();
  if (dur <= 0) { alert('Nothing to export.'); return; }
  const btn = document.getElementById('export-btn');
  btn.disabled = true; btn.textContent = 'Rendering...';
  try {
    const sr = 44100;
    const offline = new OfflineAudioContext(2, Math.ceil((dur + 1) * sr), sr);
    const master = offline.createGain(); master.gain.value = 0.8; master.connect(offline.destination);
    scheduleSong(offline, master, 0, null);
    const buffer = await offline.startRendering();
    const wav = audioBufferToWav(buffer);
    downloadBlob(new Blob([wav], { type: 'audio/wav' }), 'nasty-song.wav');
  } catch (e) { alert('Export failed: ' + e.message);
  } finally { btn.disabled = false; btn.textContent = 'Export WAV'; }
}

function audioBufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length * numCh * 2 + 44;
  const arr = new ArrayBuffer(len);
  const view = new DataView(arr);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o+i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, len - 8, true);
  writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numCh, true);
  view.setUint32(24, buffer.sampleRate, true);
  view.setUint32(28, buffer.sampleRate * numCh * 2, true);
  view.setUint16(32, numCh * 2, true); view.setUint16(34, 16, true);
  writeStr(36, 'data'); view.setUint32(40, len - 44, true);
  let offset = 44;
  const channels = [];
  for (let c = 0; c < numCh; c++) channels.push(buffer.getChannelData(c));
  for (let i = 0; i < buffer.length; i++) {
    for (let c = 0; c < numCh; c++) {
      let sample = Math.max(-1, Math.min(1, channels[c][i]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      view.setInt16(offset, sample, true);
      offset += 2;
    }
  }
  return arr;
}

// ============================================================
// MIDI keyboard → current pattern via armed channel
// ============================================================
let midiAccess = null;
let currentMidiInput = null;
let midiRecording = null;

async function initMIDI() {
  if (!navigator.requestMIDIAccess) {
    const sel = document.getElementById('midi-select');
    sel.innerHTML = '<option>Web MIDI unsupported (use Chrome)</option>';
    sel.disabled = true;
    return;
  }
  try {
    midiAccess = await navigator.requestMIDIAccess();
    refreshMidiList();
    midiAccess.onstatechange = refreshMidiList;
  } catch (e) { console.error('MIDI init failed', e); }
}
function refreshMidiList() {
  const sel = document.getElementById('midi-select');
  const prev = sel.value;
  sel.innerHTML = '<option value="">— none —</option>';
  for (const [id, input] of midiAccess.inputs) {
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = input.name;
    sel.appendChild(opt);
  }
  if (prev) sel.value = prev;
  attachMidiInput(sel.value);
}
function attachMidiInput(id) {
  if (currentMidiInput) currentMidiInput.onmidimessage = null;
  currentMidiInput = null;
  if (!id || !midiAccess) return;
  const input = midiAccess.inputs.get(id);
  if (!input) return;
  input.onmidimessage = onMidiMessage;
  currentMidiInput = input;
}

function onMidiMessage(e) {
  const [status, data1, data2] = e.data;
  const type = status & 0xf0;
  const armed = song.channels.find(c => c.armed);
  if (type === 0x90 && data2 > 0) {
    const velocity = data2 / 127;
    if (armed) previewNote(armed.instrument, data1, velocity, 0.5);
    if (midiRecording) {
      const t = ctx.currentTime - midiRecording.startTime;
      midiRecording.active[data1] = { pitch: data1, velocity, tStart: t };
    }
  } else if (type === 0x80 || (type === 0x90 && data2 === 0)) {
    if (midiRecording && midiRecording.active[data1]) {
      const start = midiRecording.active[data1];
      const t = ctx.currentTime - midiRecording.startTime;
      midiRecording.notes.push({
        pitch: start.pitch, velocity: start.velocity,
        tStart: start.tStart, tEnd: t,
      });
      delete midiRecording.active[data1];
    }
  }
}

function startMidiRecording() {
  const armed = song.channels.find(c => c.armed);
  if (!armed) { alert('Arm a channel first (● in the Channel Rack).'); return; }
  const pat = song.patterns.find(p => p.id === currentPatternId);
  if (!pat) { alert('Select or create a pattern first.'); return; }
  initAudio();
  if (ctx.state === 'suspended') ctx.resume();
  const secPerBeat = 60 / song.bpm;
  const countInBeats = 4;
  const t0 = ctx.currentTime + 0.2;
  const recStart = t0 + countInBeats * secPerBeat;
  midiRecording = { channelId: armed.id, patternId: pat.id, startTime: recStart, notes: [], active: {} };
  const totalBeats = countInBeats + pat.lengthBars * 4 * 4;
  for (let b = 0; b < totalBeats; b++) {
    const bt = t0 + b * secPerBeat;
    playClick(ctx, masterGain, bt, b % 4 === 0);
  }
  document.getElementById('midi-rec-btn').classList.add('active');
  const status = document.getElementById('rec-status');
  status.classList.remove('hidden');
  status.textContent = 'REC MIDI → ' + pat.name + ' (count-in…)';
  setTimeout(() => { if (midiRecording) status.textContent = 'REC MIDI → ' + pat.name; }, (countInBeats * secPerBeat + 0.2) * 1000);
}

function stopMidiRecording() {
  if (!midiRecording) return;
  const rec = midiRecording;
  midiRecording = null;
  document.getElementById('midi-rec-btn').classList.remove('active');
  document.getElementById('rec-status').classList.add('hidden');
  const nowT = ctx.currentTime - rec.startTime;
  for (const p in rec.active) {
    const s = rec.active[p];
    rec.notes.push({ pitch: s.pitch, velocity: s.velocity, tStart: s.tStart, tEnd: nowT });
  }
  if (!rec.notes.length) return;
  const pat = song.patterns.find(p => p.id === rec.patternId);
  if (!pat) return;
  const q = document.getElementById('quantize').checked;
  const bpm = song.bpm;
  for (const n of rec.notes) {
    if (n.tStart < 0 || n.tEnd <= n.tStart) continue;
    let startBeat = n.tStart * bpm / 60;
    let dur = (n.tEnd - n.tStart) * bpm / 60;
    if (q) { startBeat = Math.round(startBeat * 4) / 4; dur = Math.max(0.25, Math.round(dur * 4) / 4); }
    // Wrap into pattern length if too long
    if (startBeat > pat.lengthBars * 4) continue;
    pat.notes.push({
      channelId: rec.channelId, pitch: n.pitch,
      startBeat, durationBeats: dur, velocity: n.velocity,
    });
  }
  const maxEnd = pat.notes.reduce((m,n) => Math.max(m, n.startBeat + n.durationBeats), 0);
  if (maxEnd / 4 > pat.lengthBars) pat.lengthBars = Math.ceil(maxEnd / 4);
  render();
}

// ============================================================
// Wire up
// ============================================================
document.getElementById('play-btn').addEventListener('click', () => {
  if (!song.tracks.some(t => t.clips.length)) return;
  playSong();
});
document.getElementById('stop-btn').addEventListener('click', () => {
  if (isMicRecording) stopMicRecording();
  else stopSong();
});
document.getElementById('loop-btn').addEventListener('click', () => {
  loopEnabled = !loopEnabled;
  document.getElementById('loop-btn').classList.toggle('active', loopEnabled);
});
document.getElementById('mic-rec-btn').addEventListener('click', () => {
  if (isMicRecording) stopMicRecording(); else startMicRecording();
});
document.getElementById('midi-rec-btn').addEventListener('click', () => {
  if (midiRecording) stopMidiRecording(); else startMidiRecording();
});
document.getElementById('clear-btn').addEventListener('click', () => {
  if (!confirm('Clear the song? (channels, patterns, and playlist all reset)')) return;
  song = { bpm: 120, bars: MIN_BARS, channels: [], patterns: [], tracks: [], mixer: { inserts: [] } };
  chatHistory = [];
  audioBuffers.clear();
  currentPatternId = null;
  ensureDefaults();
  document.getElementById('chat-messages').innerHTML = '';
  stopSong();
  render();
});
document.getElementById('bpm-input').addEventListener('change', (e) => {
  const v = parseInt(e.target.value);
  if (v >= 30 && v <= 300) { song.bpm = v; persist(); }
});
document.getElementById('add-channel-btn').addEventListener('click', () => {
  document.getElementById('add-channel-modal').classList.remove('hidden');
  document.getElementById('new-channel-name').focus();
});
document.getElementById('new-channel-cancel').addEventListener('click', () => {
  document.getElementById('add-channel-modal').classList.add('hidden');
});
document.getElementById('new-channel-ok').addEventListener('click', () => {
  const name = document.getElementById('new-channel-name').value.trim() || 'Channel';
  const inst = document.getElementById('new-channel-inst').value;
  const id = 'ch_' + inst + '_' + Date.now().toString(36);
  song.channels.push({
    id, name, instrument: inst, volume: 0.8, effects: [],
    muted: false, solo: false, armed: false,
    color: PALETTE[song.channels.length % PALETTE.length],
  });
  document.getElementById('add-channel-modal').classList.add('hidden');
  render();
});
document.getElementById('add-pattern-btn').addEventListener('click', () => {
  document.getElementById('add-pattern-modal').classList.remove('hidden');
  document.getElementById('new-pattern-name').focus();
});
document.getElementById('new-pattern-cancel').addEventListener('click', () => {
  document.getElementById('add-pattern-modal').classList.add('hidden');
});
document.getElementById('new-pattern-ok').addEventListener('click', () => {
  const name = document.getElementById('new-pattern-name').value.trim() || 'Pattern ' + (song.patterns.length+1);
  const len = parseInt(document.getElementById('new-pattern-length').value) || 2;
  const id = 'pat_' + Date.now().toString(36);
  song.patterns.push({
    id, name, lengthBars: len, notes: [],
    color: PALETTE[song.patterns.length % PALETTE.length],
  });
  currentPatternId = id;
  document.getElementById('add-pattern-modal').classList.add('hidden');
  render();
});
document.getElementById('mixer-btn').addEventListener('click', openMixer);
document.getElementById('mixer-close').addEventListener('click', closeMixer);
document.getElementById('add-insert-btn').addEventListener('click', () => {
  const nextIdx = song.mixer.inserts.filter(i => i.id !== 'master').length + 1;
  song.mixer.inserts.push({
    id: 'ins_' + Date.now().toString(36),
    name: 'Insert ' + nextIdx, volume: 0.8, effects: [], sendToId: 'master',
  });
  renderMixer(); render();
});
document.getElementById('save-btn').addEventListener('click', saveToFile);
document.getElementById('load-btn').addEventListener('click', loadFromFile);
document.getElementById('export-btn').addEventListener('click', exportWAV);
document.getElementById('midi-select').addEventListener('change', (e) => attachMidiInput(e.target.value));
document.getElementById('pr-close').addEventListener('click', closePianoRoll);
document.getElementById('piano-roll-panel').addEventListener('contextmenu', (e) => e.preventDefault());
document.getElementById('pr-active-channel').addEventListener('change', (e) => {
  pianoRollActiveChannelId = e.target.value;
});
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    sendMessage();
  }
});

// ============================================================
// Boot
// ============================================================
loadFromStorage();
ensureDefaults();
render();
initMIDI();
initAudioDrop();
initPianoRollDrop();
</script>
</body>
